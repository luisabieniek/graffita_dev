<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>entrar — vitrine</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>

  <header class="topbar">
    <a class="marca" href="/"><span class="selo">vitrine</span></a>
    <span></span>
    <nav class="nav-acoes">
      <a class="btn btn-menta" href="/cadastro">criar conta</a>
    </nav>
  </header>

  <main class="pagina-central">
    <div class="cartao">
      <h1>fala, de novo!</h1>
      <p class="subtitulo">Entra com seu e-mail e senha pra continuar no mural.</p>

      <form id="form-login">
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="voce@email.com" required />
        </div>

        <div class="campo campo-senha">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="••••••••" required />
          <button type="button" class="alternar-senha" data-alvo="senha" aria-label="Mostrar senha">👁️</button>
        </div>

        <div class="linha-auxiliar">
          <button type="button" id="abrir-recuperar" class="link-discreto">Esqueci minha senha</button>
        </div>

        <button type="submit" class="btn btn-coral btn-bloco">entrar</button>

        <p id="mensagem" class="mensagem"></p>
      </form>

      <p class="rodape-cartao">Não tem conta? <a href="/cadastro">Cadastre-se</a></p>
    </div>
  </main>

  <!-- modal de recuperação de senha -->
  <div id="sobreposicao" class="sobreposicao">
    <div class="modal">
      <button class="fechar-modal" id="fechar-recuperar" aria-label="Fechar">✕</button>
      <h2>recuperar senha</h2>
      <p class="subtitulo">Confirma seu e-mail e escolhe uma senha nova.</p>

      <form id="form-recuperar">
        <div class="campo">
          <label for="email-recuperar">E-mail cadastrado</label>
          <input id="email-recuperar" type="email" placeholder="voce@email.com" required />
        </div>

        <div class="campo campo-senha">
          <label for="nova-senha">Nova senha</label>
          <input id="nova-senha" type="password" placeholder="••••••••" minlength="4" required />
          <button type="button" class="alternar-senha" data-alvo="nova-senha" aria-label="Mostrar senha">👁️</button>
        </div>

        <button type="submit" class="btn btn-escuro btn-bloco">redefinir senha</button>

        <p id="mensagem-recuperar" class="mensagem"></p>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
